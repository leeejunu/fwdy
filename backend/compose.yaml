services:
  postgres:
    image: postgres:17-alpine
    container_name: forward-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forward
      POSTGRES_USER: forward
      POSTGRES_PASSWORD: forward-local
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - forward-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forward -d forward"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  forward-postgres-data:
