services:
  backend:
    image: 427553887212.dkr.ecr.ap-northeast-2.amazonaws.com/fwdy-server:latest
    container_name: fwdy-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod

  nginx:
    image: nginx:stable-alpine
    container_name: fwdy-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
