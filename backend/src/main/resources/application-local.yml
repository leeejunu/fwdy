app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002}"

spring:
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/forward}
    username: ${DATABASE_USERNAME:forward}
    password: ${DATABASE_PASSWORD:forward-local}
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        model: ${OPENAI_MODEL:gpt-6-luna}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  port: ${SERVER_PORT:8081}
