# Trust Cloudflare's published proxy ranges so Nginx rate-limits the actual
# visitor IP instead of treating every Cloudflare edge as one client.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# General API ceiling: 10 requests/second per visitor, with a short burst.
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=10r/s;

# Expensive mail analysis: sustained 3 POSTs/minute per visitor,
# allowing two immediate retries/clicks before returning HTTP 429.
map "$request_method:$uri" $analysis_client {
    default "";
    "POST:/api/quote-analyses" $binary_remote_addr;
}
limit_req_zone $analysis_client zone=analysis_per_ip:10m rate=3r/m;

server {
    listen 80;
    server_name api.fwdy.app;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.fwdy.app;

    limit_req_status 429;

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        client_max_body_size 4m;
        limit_req zone=api_per_ip burst=20 nodelay;
        limit_req zone=analysis_per_ip burst=2 nodelay;

        proxy_pass http://backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI mail analysis can take longer than a typical API request.
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
